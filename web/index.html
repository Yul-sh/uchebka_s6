<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fly-Y — каталог туров">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fly-Y">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fly-Y — каталог туров</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #EAF6F7;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #flyy-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #1A3F44;
      z-index: 9999;
      transition: opacity .35s ease;
    }
    #flyy-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #flyy-splash .brand {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    #flyy-splash .hint {
      font-size: 0.95rem;
      opacity: 0.75;
    }
    #flyy-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #C5E8EC;
      border-top-color: #4AA8B0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="flyy-splash" aria-live="polite">
    <div class="brand">Fly-Y</div>
    <div class="hint">каталог туров</div>
    <div class="spinner" role="status" aria-label="Загрузка"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('flyy-splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
    window.addEventListener('online', function () {
      window.dispatchEvent(new CustomEvent('flyy-online'));
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
